<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Catalysis: Artículo no encontrado</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F2EC}
a{text-decoration:none;color:inherit}
button,input,select,textarea{font-family:'Inter',system-ui,sans-serif}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #14171C;outline-offset:2px}
.dk a:focus-visible,.dk button:focus-visible,.dk input:focus-visible,.dk select:focus-visible{outline-color:#F4F2EC}
button:disabled{cursor:not-allowed;opacity:.62}
.fx{outline:3px solid #14171C;outline-offset:2px}
.dk .fx{outline-color:#F4F2EC}
input:disabled,select:disabled{background:#ECE9E0 !important;color:#5A6068 !important;cursor:not-allowed}
::placeholder{color:#5A6068;opacity:1}
.hv-f:hover{filter:brightness(.9)}
.hv-o:hover{background:#ECE9E0 !important}
.hv-d:hover{background:#262B33 !important}
.hv-c:hover{border-color:#14171C !important}
.hv-u:hover{text-decoration:underline}
.nv:hover{background:#1B1F26}
.mbar{display:none}
.toc-m{display:none}
.prose h2{margin:44px 0 14px;font-family:'Sora',sans-serif;font-weight:600;font-size:28px;line-height:1.2;letter-spacing:-0.02em}
.prose h3{margin:32px 0 10px;font-family:'Sora',sans-serif;font-weight:600;font-size:20px;line-height:1.3;letter-spacing:-0.01em}
.prose p{margin:0 0 18px;font-size:17px;line-height:1.75;color:#3A3F47}
.prose ul,.prose ol{margin:0 0 20px;padding-left:22px;font-size:17px;line-height:1.7;color:#3A3F47}
.prose li{margin-bottom:8px}
.prose li::marker{color:#C23E15}
.prose strong{color:#14171C}
.prose a{color:#8F2D0F;text-decoration:underline}
.prose blockquote{margin:28px 0;padding:4px 0 4px 20px;border-left:3px solid #C23E15;font-family:'Sora',sans-serif;font-size:20px;line-height:1.45;color:#14171C}
.prose h4{margin:24px 0 8px;font-family:'Sora',sans-serif;font-weight:600;font-size:16px;line-height:1.35}
.prose .note{margin:0 0 24px;padding:18px 20px;border-radius:12px;background:color-mix(in srgb,#C23E15 12%,#ffffff)}
.prose .note p{margin:0;font-size:15px;color:#3A3F47}
.prose .kv{margin:0 0 24px;padding:18px 20px;border:1px solid #DAD6CB;border-radius:12px;background:#FFFFFF}
.prose .kv p{margin:0 0 8px;font-size:15px;line-height:1.5}
.prose .kv p:last-child{margin:0}
.prose figure{margin:28px 0}
.prose figure img{width:100%;display:block;border-radius:12px}
.prose figcaption{margin-top:10px;font-size:13px;color:#5A6068}
.tbl{overflow-x:auto;margin:0 0 24px;border:1px solid #DAD6CB;border-radius:12px;background:#FFFFFF}
.tbl table{border-collapse:collapse;width:100%;min-width:520px;font-size:15px;line-height:1.5}
.tbl th{text-align:left;padding:12px 16px;background:#ECE9E0;font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:12px;letter-spacing:0.08em;color:#14171C}
.tbl td{padding:12px 16px;border-top:1px solid #ECE9E0;color:#3A3F47;vertical-align:top}
.tbl td:first-child{font-weight:600;color:#14171C}
@keyframes sk{0%{opacity:.55}50%{opacity:1}100%{opacity:.55}}
.sk{animation:sk 1.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .9s linear infinite}
@media (prefers-reduced-motion:reduce){.sk,.spin{animation:none}}
@media (max-width:900px){
.side{display:none !important}
.mbar{display:block}
.crumb{display:none !important}
.pad{padding-left:32px !important;padding-right:32px !important}
.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
.fgrid{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
.h1{font-size:44px !important}
.h2{font-size:28px !important}
.toc-side{display:none !important}
.toc-m{display:block}
}
@media (max-width:640px){
.pad{padding-left:20px !important;padding-right:20px !important}
.g2,.g3,.g4,.fgrid{grid-template-columns:minmax(0,1fr) !important}
.h1{font-size:34px !important}
.h2{font-size:25px !important}
.bigcard{padding:28px 22px !important}
section.pad{padding-bottom:28px !important}
.tt{min-height:44px !important}
.bpad{padding-bottom:96px !important}
.prose h2{font-size:24px}
.prose p,.prose ul,.prose ol{font-size:16px}
.tbl{overflow-x:visible}
.tbl table,.tbl tbody,.tbl tr,.tbl td{display:block;min-width:0 !important}
.tbl thead{display:none}
.tbl tr+tr{border-top:1px solid #DAD6CB}
.tbl td{border-top:0;padding:6px 16px}
.tbl td:first-child{background:#ECE9E0;padding:10px 16px;font-family:'Sora',sans-serif}
.tbl td[data-label]::before{content:attr(data-label);display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.08em;color:#5A6068;margin-bottom:2px}
.tbl tr td:last-child{padding-bottom:12px}
}
.cap{color:#5A6068}
.dk .cap{color:#A4A8B0}
</style>
</helmet>
<dc-import name="Articulo" accent="{{accent}}" state="notfound" hint-size="1360px,900px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C23E15","options":["#C23E15","#1F6F66","#2F4FD1","#14171C"]},"$preview":{"width":1360,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const a = this.props.accent ?? '#C23E15';
return {
accent: a,
accentSoft: 'color-mix(in srgb, ' + a + ' 12%, #ffffff)'
};
}
}
</script>
</body>
</html>

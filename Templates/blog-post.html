<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cómo implementar IA generativa en tu empresa - Catalysis Blog</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0f0f0f;
            --secondary: #ffffff;
            --text: #666666;
            --light-bg: #fafafa;
            --border: #e5e5e5;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.8;
            color: var(--text);
            background: var(--secondary);
            overflow-x: hidden;
        }

        /* Navigation */
        nav {
            position: fixed;
            width: 100%;
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 1px 0 var(--border);
            padding: 1.5rem 5%;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .nav-container {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1rem;
            font-weight: 400;
            color: var(--primary);
            letter-spacing: 1px;
            text-transform: lowercase;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 3.5rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 400;
            font-size: 0.875rem;
            letter-spacing: 0.5px;
            transition: opacity 0.3s;
        }

        .nav-links a:hover {
            opacity: 0.6;
        }

        .nav-cta {
            background: transparent;
            color: var(--primary);
            padding: 0.75rem 2rem;
            border: 1px solid var(--primary);
            text-decoration: none;
            font-weight: 400;
            font-size: 0.875rem;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .nav-cta:hover {
            background: var(--primary);
            color: var(--secondary);
        }

        /* Article Header */
        .article-header {
            padding: 180px 5% 80px;
            background: var(--secondary);
        }

        .header-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .breadcrumb {
            font-size: 0.75rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text);
            margin-bottom: 3rem;
        }

        .breadcrumb a {
            color: var(--text);
            text-decoration: none;
            transition: opacity 0.3s;
        }

        .breadcrumb a:hover {
            opacity: 0.6;
        }

        .article-category {
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--primary);
            margin-bottom: 2rem;
            font-weight: 400;
        }

        .article-title {
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            line-height: 1.1;
            font-weight: 300;
            color: var(--primary);
            margin-bottom: 2rem;
            letter-spacing: -0.02em;
        }

        .article-meta {
            display: flex;
            gap: 2rem;
            padding: 2rem 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Firebase Connection</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #f5f5f5;
        }
        .result {
            background: white;
            padding: 20px;
            margin: 10px 0;
            border-radius: 5px;
            border-left: 4px solid #4CAF50;
        }
        .error {
            border-left-color: #f44336;
        }
        .warning {
            border-left-color: #ff9800;
        }
        pre {
            background: #f5f5f5;
            padding: 10px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>🔥 Test de Conexión Firebase</h1>
    <div id="results"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>

    <script>
        const resultsDiv = document.getElementById('results');

        function addResult(title, message, type = 'result') {
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.innerHTML = `<h3>${title}</h3><p>${message}</p>`;
            resultsDiv.appendChild(div);
        }

        function addCode(title, data) {
            const div = document.createElement('div');
            div.className = 'result';
            div.innerHTML = `<h3>${title}</h3><pre>${JSON.stringify(data, null, 2)}</pre>`;
            resultsDiv.appendChild(div);
        }

        async function testFirebase() {
            // Test 1: Firebase SDK cargado
            if (typeof firebase === 'undefined') {
                addResult('❌ Error', 'Firebase SDK no está cargado', 'error');
                return;
            } else {
                addResult('✅ Firebase SDK', 'Firebase SDK cargado correctamente');
            }

            // Test 2: Firebase inicializado
            if (!window.firestoreDb) {
                addResult('❌ Error', 'Firebase no está inicializado. Verifica firebase-config.js', 'error');
                return;
            } else {
                addResult('✅ Firebase Inicializado', 'Conexión a Firestore establecida');
            }

            // Test 3: Intentar leer colección blog_posts
            try {
                addResult('🔄 Consultando...', 'Intentando leer colección blog_posts', 'warning');

                const snapshot = await window.firestoreDb
                    .collection('blog_posts')
                    .get();

                if (snapshot.empty) {
                    addResult('⚠️ Sin Posts', 'La colección blog_posts existe pero está vacía. Necesitas crear posts.', 'warning');
                } else {
                    addResult('✅ Posts Encontrados', `Se encontraron ${snapshot.size} documento(s) en blog_posts`);

                    // Mostrar cada post
                    snapshot.forEach((doc, index) => {
                        const data = doc.data();
                        addCode(`📄 Post ${index + 1} (ID: ${doc.id})`, {
                            id: doc.id,
                            titulo: data.titulo,
                            publicado: data.publicado,
                            fecha_publicacion: data.fecha_publicacion?.toDate().toISOString(),
                            categoria: data.categoria,
                            autor: data.autor
                        });
                    });

                    // Verificar posts publicados
                    const publishedSnapshot = await window.firestoreDb
                        .collection('blog_posts')
                        .where('publicado', '==', true)
                        .get();

                    addResult('✅ Posts Publicados', `${publishedSnapshot.size} post(s) con publicado=true`);
                }
            } catch (error) {
                addResult('❌ Error al Leer Firestore', `Error: ${error.message}`, 'error');
                addCode('Detalles del Error', {
                    code: error.code,
                    message: error.message,
                    stack: error.stack
                });

                // Sugerencias según el error
                if (error.code === 'permission-denied') {
                    addResult('💡 Solución', 'Error de permisos. Verifica que las reglas de Firestore estén publicadas correctamente.', 'warning');
                } else if (error.message.includes('indexes')) {
                    addResult('💡 Solución', 'Necesitas crear un índice en Firestore. Firebase debería mostrarte un enlace en la consola.', 'warning');
                }
            }
        }

        // Ejecutar tests cuando la página cargue
        window.addEventListener('load', () => {
            setTimeout(testFirebase, 1000); // Esperar 1 segundo para que Firebase se inicialice
        });
    </script>
</body>
</html>
